; PlatformIO Project Configuration File for Pistachio Smart Controller
; ESP32 Shelly Manager with Auto-Discovery and Logic Engine
;
; Documentation: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Configuration
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Filesystem Configuration (LittleFS)
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Build Flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Library Dependencies
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

; Upload Configuration
upload_speed = 115200
upload_port = /dev/cu.usbserial-110

; OTA Configuration
upload_protocol = esptool

; Advanced Options
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
